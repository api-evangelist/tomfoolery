name: Tomfoolery
description: Tomfoolery, Inc. was a San Francisco mobile-app lab founded in 2012 by
  Sol Lipman (Chief Product Officer) and Kakul Srivastava (CEO), a team of ex-Yahoo
  and ex-AOL executives building consumer-grade, mobile-first collaboration apps for
  the enterprise. Its debut product was Anchor, a real-time conversation platform
  meant to be a central hub for work discussions, followed by an app called Action.
  The company raised roughly $1.7M (investors included Andreessen Horowitz) before
  being acquired by Yahoo in January 2014, after which the Anchor app was shut down.
  Tomfoolery is now a defunct/deadpooled company with no live website, developer portal,
  or public API surface. It was surfaced as a VC portfolio company and added to the
  API Evangelist network as a stub; enrichment confirms there is no API to profile.
